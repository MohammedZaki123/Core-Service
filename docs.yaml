openapi: 3.0.3
info:
  title: QuickBite Core Platform API
  description: |
    Core platform service for QuickBite food delivery system.
    
    Handles authentication, user management, restaurant management, menus, and RBAC.
  version: 1.0.0
  contact:
    name: QuickBite API Support
    email: api@quickbite.com

servers:
  - url: https://api.quickbite.com/v1
    description: Production
  - url: https://api-staging.quickbite.com/v1
    description: Staging
  - url: http://localhost:3000/v1
    description: Development

tags:
  - name: Authentication
    description: User authentication and authorization
  - name: Users
    description: User profile management
  - name: Customer Addresses
    description: Customer delivery addresses
  - name: Restaurants
    description: Restaurant management
  - name: Branches
    description: Restaurant branch management
  - name: Menus
    description: Menu category management
  - name: Products
    description: Product/menu item management
  - name: Restaurant Members
    description: Restaurant staff management
  - name: Branch Access
    description: Staff branch access control
  - name: Roles & Permissions
    description: Custom role and permission management

security:
  - BearerAuth: []

paths:
  # ==========================================================================
  # AUTHENTICATION
  # ==========================================================================

  /auth/register:
    post:
      tags: [Authentication]
      summary: Register new user
      description: Create a new user account
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - phone
                - name
                - password
                - role
              properties:
                email:
                  type: string
                  format: email
                  example: user@email.com
                phone:
                  type: string
                  example: "01000000000"
                name:
                  type: string
                  example: John Doe
                password:
                  type: string
                  format: password
                  minLength: 8
                  example: StrongPassword123
                role:
                  type: string
                  enum: [customer, restaurant_user, delivery_agent, admin]
                  example: customer
      responses:
        '201':
          description: User registered successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Registered successfully
                  accessToken:
                    type: string
                    example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                  refreshToken:
                    type: string
                    example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                  user:
                    $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: Email or phone already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/login:
    post:
      tags: [Authentication]
      summary: Login user
      description: Authenticate user and obtain tokens
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                  example: user@email.com
                password:
                  type: string
                  format: password
                  example: password
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Login successful
                  accessToken:
                    type: string
                  refreshToken:
                    type: string
                  user:
                    $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/forgot-password:
    post:
      tags: [Authentication]
      summary: Request password reset
      description: Send password reset OTP to user's email
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
              properties:
                email:
                  type: string
                  format: email
                  example: user@email.com
      responses:
        '200':
          description: Reset email sent if account exists
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Reset email sent if account exists

  /auth/reset-password:
    post:
      tags: [Authentication]
      summary: Reset password with OTP
      description: Reset user password using OTP received via email
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - otp
                - newPassword
              properties:
                email:
                  type: string
                  format: email
                  example: user@email.com
                otp:
                  type: string
                  example: "123456"
                newPassword:
                  type: string
                  format: password
                  minLength: 8
                  example: NewStrongPassword
      responses:
        '200':
          description: Password reset successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Password reset successful
        '400':
          description: Invalid or expired OTP
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/refresh:
    post:
      tags: [Authentication]
      summary: Refresh access token
      description: Obtain new access token using refresh token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - refreshToken
              properties:
                refreshToken:
                  type: string
                  example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
      responses:
        '200':
          description: Token refreshed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  accessToken:
                    type: string
        '401':
          description: Invalid or expired refresh token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ==========================================================================
  # USERS
  # ==========================================================================

  /users/me:
    get:
      tags: [Users]
      summary: Get current user profile
      responses:
        '200':
          description: User profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'

    patch:
      tags: [Users]
      summary: Update current user profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  example: New Name
                phone:
                  type: string
                  example: "01000000001"
      responses:
        '200':
          description: Profile updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Profile updated
                  user:
                    $ref: '#/components/schemas/User'

  # ==========================================================================
  # CUSTOMER ADDRESSES
  # ==========================================================================

  /customer/addresses:
    get:
      tags: [Customer Addresses]
      summary: List customer addresses
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
            minimum: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
            minimum: 1
            maximum: 100
      responses:
        '200':
          description: List of addresses
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Address'
                  pagination:
                    $ref: '#/components/schemas/Pagination'

    post:
      tags: [Customer Addresses]
      summary: Add new address
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddressInput'
      responses:
        '201':
          description: Address added
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Address added
                  address:
                    $ref: '#/components/schemas/Address'

  /customer/addresses/{addressId}:
    parameters:
      - $ref: '#/components/parameters/AddressId'

    patch:
      tags: [Customer Addresses]
      summary: Update address
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddressInput'
      responses:
        '200':
          description: Address updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Address updated
                  address:
                    $ref: '#/components/schemas/Address'

    delete:
      tags: [Customer Addresses]
      summary: Delete address
      responses:
        '200':
          description: Address deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Address deleted

  # ==========================================================================
  # RESTAURANTS
  # ==========================================================================

  /restaurants:
    get:
      tags: [Restaurants]
      summary: List restaurants
      description: Public endpoint to search restaurants by location
      security: []
      parameters:
        - name: lat
          in: query
          required: true
          schema:
            type: number
            format: double
          example: 30.0444
        - name: lng
          in: query
          required: true
          schema:
            type: number
            format: double
          example: 31.2357
      responses:
        '200':
          description: List of restaurants
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RestaurantSummary'

    post:
      tags: [Restaurants]
      summary: Create restaurant
      description: |
        Create a new restaurant.
        
        **Required role:** ADMIN or RESTAURANT_OWNER
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - primaryCountry
              properties:
                name:
                  type: string
                  example: Burger House
                primaryCountry:
                  type: string
                  example: EG
      responses:
        '201':
          description: Restaurant created
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Restaurant created
                  restaurantId:
                    type: integer
                    example: 1

  /restaurants/{restaurantId}:
    parameters:
      - $ref: '#/components/parameters/RestaurantId'

    get:
      tags: [Restaurants]
      summary: Get restaurant details
      security: []
      responses:
        '200':
          description: Restaurant details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Restaurant'

    patch:
      tags: [Restaurants]
      summary: Update restaurant
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                primaryCountry:
                  type: string
      responses:
        '200':
          description: Restaurant updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Restaurant updated

  /restaurants/{restaurantId}/status:
    parameters:
      - $ref: '#/components/parameters/RestaurantId'

    patch:
      tags: [Restaurants]
      summary: Update restaurant status
      description: |
        Update restaurant status (activate/deactivate).
        
        **Required role:** ADMIN only
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - status
              properties:
                status:
                  type: string
                  enum: [ACTIVE, DISABLED]
                  example: ACTIVE
      responses:
        '200':
          description: Status updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Status updated

  # ==========================================================================
  # BRANCHES
  # ==========================================================================

  /restaurants/{restaurantId}/branches:
    parameters:
      - $ref: '#/components/parameters/RestaurantId'

    get:
      tags: [Branches]
      summary: List restaurant branches
      security: []
      responses:
        '200':
          description: List of branches
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Branch'

    post:
      tags: [Branches]
      summary: Create branch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BranchInput'
      responses:
        '201':
          description: Branch created
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Branch created
                  branchId:
                    type: integer
                    example: 10

  /branches/{branchId}:
    parameters:
      - $ref: '#/components/parameters/BranchId'

    patch:
      tags: [Branches]
      summary: Update branch
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BranchInput'
      responses:
        '200':
          description: Branch updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Branch updated

  /branches/{branchId}/status:
    parameters:
      - $ref: '#/components/parameters/BranchId'

    patch:
      tags: [Branches]
      summary: Update branch status
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - isActive
              properties:
                isActive:
                  type: boolean
      responses:
        '200':
          description: Branch status updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Branch status updated

  /branches/{branchId}/delivery-zone:
    parameters:
      - $ref: '#/components/parameters/BranchId'

    put:
      tags: [Branches]
      summary: Update delivery zone
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - radiusKm
              properties:
                radiusKm:
                  type: integer
                  minimum: 1
                  maximum: 50
                  example: 5
      responses:
        '200':
          description: Delivery zone updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Delivery zone updated

  # ==========================================================================
  # MENUS
  # ==========================================================================

  /branches/{branchId}/menu:
    parameters:
      - $ref: '#/components/parameters/BranchId'

    get:
      tags: [Menus]
      summary: Get branch menu
      description: Get menu with products for a specific branch
      security: []
      responses:
        '200':
          description: Branch menu
          content:
            application/json:
              schema:
                type: object
                properties:
                  menuId:
                    type: integer
                    example: 1
                  products:
                    type: array
                    items:
                      $ref: '#/components/schemas/Product'

  /restaurants/{restaurantId}/menus:
    parameters:
      - $ref: '#/components/parameters/RestaurantId'

    post:
      tags: [Menus]
      summary: Create menu category
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - categoryName
              properties:
                categoryName:
                  type: string
                  example: Burgers
      responses:
        '201':
          description: Menu created
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Menu created
                  menuId:
                    type: integer

  /menus/{menuId}:
    parameters:
      - $ref: '#/components/parameters/MenuId'

    patch:
      tags: [Menus]
      summary: Update menu category
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                categoryName:
                  type: string
      responses:
        '200':
          description: Menu updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Menu updated

  /menus/{menuId}/status:
    parameters:
      - $ref: '#/components/parameters/MenuId'

    patch:
      tags: [Menus]
      summary: Update menu status
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - isActive
              properties:
                isActive:
                  type: boolean
      responses:
        '200':
          description: Menu status updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Menu status updated

  # ==========================================================================
  # PRODUCTS
  # ==========================================================================

  /menus/{menuId}/products:
    parameters:
      - $ref: '#/components/parameters/MenuId'

    post:
      tags: [Products]
      summary: Create product
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductInput'
      responses:
        '201':
          description: Product created
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Product created
                  productId:
                    type: integer

  /products/{productId}:
    parameters:
      - $ref: '#/components/parameters/ProductId'

    patch:
      tags: [Products]
      summary: Update product
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductInput'
      responses:
        '200':
          description: Product updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Product updated

  /products/{productId}/status:
    parameters:
      - $ref: '#/components/parameters/ProductId'

    patch:
      tags: [Products]
      summary: Update product status
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - isAvailable
              properties:
                isAvailable:
                  type: boolean
      responses:
        '200':
          description: Product status updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Product status updated

  /branches/{branchId}/products/{productId}:
    parameters:
      - $ref: '#/components/parameters/BranchId'
      - $ref: '#/components/parameters/ProductId'

    patch:
      tags: [Products]
      summary: Update branch-specific product details
      description: Update pricing and availability for a product at a specific branch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                price:
                  type: number
                  format: decimal
                  example: 130
                isAvailable:
                  type: boolean
                  example: true
      responses:
        '200':
          description: Branch product updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Branch product updated

  # ==========================================================================
  # RESTAURANT MEMBERS
  # ==========================================================================

  /restaurants/{restaurantId}/members:
    parameters:
      - $ref: '#/components/parameters/RestaurantId'

    get:
      tags: [Restaurant Members]
      summary: List restaurant staff members
      responses:
        '200':
          description: List of staff members
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RestaurantMember'

    post:
      tags: [Restaurant Members]
      summary: Add staff member
      description: |
        Add a new staff member to the restaurant.
        
        **Required role:** Owner only
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - userId
                - rolePermissionsId
              properties:
                userId:
                  type: integer
                rolePermissionsId:
                  type: integer
                  description: ID from role_permissions table
      responses:
        '201':
          description: Member added
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Member added
                  memberId:
                    type: integer

  /restaurants/{restaurantId}/members/{memberId}:
    parameters:
      - $ref: '#/components/parameters/RestaurantId'
      - $ref: '#/components/parameters/MemberId'

    patch:
      tags: [Restaurant Members]
      summary: Update staff member
      description: Update member role or status
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                rolePermissionsId:
                  type: integer
                status:
                  type: string
                  enum: [active, suspended, inactive]
      responses:
        '200':
          description: Member updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Member updated

    delete:
      tags: [Restaurant Members]
      summary: Remove staff member
      responses:
        '200':
          description: Member removed
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Member removed

  # ==========================================================================
  # BRANCH ACCESS
  # ==========================================================================

  /restaurants/{restaurantId}/members/{memberId}/branches:
    parameters:
      - $ref: '#/components/parameters/RestaurantId'
      - $ref: '#/components/parameters/MemberId'

    get:
      tags: [Branch Access]
      summary: Get member branch access
      responses:
        '200':
          description: List of accessible branches
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    branchId:
                      type: integer
                    label:
                      type: string

    put:
      tags: [Branch Access]
      summary: Update member branch access
      description: |
        Set which branches a staff member can access.
        
        Empty array = access to all branches
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - branchIds
              properties:
                branchIds:
                  type: array
                  items:
                    type: integer
                  example: [1, 2, 3]
      responses:
        '200':
          description: Branch access updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Branch access updated

  # ==========================================================================
  # ROLES & PERMISSIONS
  # ==========================================================================

  /restaurants/{restaurantId}/roles:
    parameters:
      - $ref: '#/components/parameters/RestaurantId'

    get:
      tags: [Roles & Permissions]
      summary: List restaurant roles
      description: Get all available roles (system + custom) for the restaurant
      responses:
        '200':
          description: List of roles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Role'

    post:
      tags: [Roles & Permissions]
      summary: Create custom role
      description: |
        Create a custom role with specific permissions.
        
        **Required role:** Owner only
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - roleName
                - permissionIds
              properties:
                roleName:
                  type: string
                  example: kitchen_staff
                permissionIds:
                  type: array
                  items:
                    type: integer
                  example: [1, 2, 3]
      responses:
        '201':
          description: Role created
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Role created
                  roleId:
                    type: integer

  /restaurants/{restaurantId}/roles/{roleId}:
    parameters:
      - $ref: '#/components/parameters/RestaurantId'
      - $ref: '#/components/parameters/RoleId'

    patch:
      tags: [Roles & Permissions]
      summary: Update custom role
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                roleName:
                  type: string
      responses:
        '200':
          description: Role updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Role updated

  /restaurants/{restaurantId}/roles/{roleId}/permissions:
    parameters:
      - $ref: '#/components/parameters/RestaurantId'
      - $ref: '#/components/parameters/RoleId'

    put:
      tags: [Roles & Permissions]
      summary: Update role permissions
      description: Replace the permissions assigned to a custom role
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - permissionIds
              properties:
                permissionIds:
                  type: array
                  items:
                    type: integer
                  example: [1, 2, 3]
      responses:
        '200':
          description: Permissions updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Permissions updated

# ==============================================================================
# COMPONENTS
# ==============================================================================

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token obtained from /auth/login

  parameters:
    RestaurantId:
      name: restaurantId
      in: path
      required: true
      schema:
        type: integer
      example: 1

    BranchId:
      name: branchId
      in: path
      required: true
      schema:
        type: integer
      example: 10

    MenuId:
      name: menuId
      in: path
      required: true
      schema:
        type: integer
      example: 1

    ProductId:
      name: productId
      in: path
      required: true
      schema:
        type: integer
      example: 1

    MemberId:
      name: memberId
      in: path
      required: true
      schema:
        type: integer
      example: 1

    RoleId:
      name: roleId
      in: path
      required: true
      schema:
        type: integer
      example: 1

    AddressId:
      name: addressId
      in: path
      required: true
      schema:
        type: integer
      example: 1

  schemas:
    User:
      type: object
      properties:
        id:
          type: integer
          example: 1
        email:
          type: string
          format: email
          example: user@email.com
        phone:
          type: string
          example: "01000000000"
        name:
          type: string
          example: John Doe
        role:
          type: string
          enum: [customer, restaurant_user, delivery_agent, admin]
          example: customer
        createdAt:
          type: string
          format: date-time
          example: "2026-02-14T12:00:00.000Z"

    Address:
      type: object
      properties:
        id:
          type: integer
          example: 1
        label:
          type: string
          example: Home
        addressText:
          type: string
          example: Street 1
        lat:
          type: number
          format: double
          example: 30.1
        lng:
          type: number
          format: double
          example: 31.2
        isDefault:
          type: boolean
          example: true

    AddressInput:
      type: object
      required:
        - label
        - addressText
        - lat
        - lng
      properties:
        label:
          type: string
          example: Home
        addressText:
          type: string
          example: Street 1
        lat:
          type: number
          format: double
          example: 30.1
        lng:
          type: number
          format: double
          example: 31.2
        isDefault:
          type: boolean
          default: false

    RestaurantSummary:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: Burger House
        logoUrl:
          type: string
          example: https://example.com/logo.png
        primaryCountry:
          type: string
          example: EG

    Restaurant:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: Burger House
        status:
          type: string
          enum: [ACTIVE, DISABLED]
          example: ACTIVE
        primaryCountry:
          type: string
          example: EG

    Branch:
      type: object
      properties:
        id:
          type: integer
          example: 10
        label:
          type: string
          example: Nasr City
        countryCode:
          type: string
          example: EG
        lat:
          type: number
          format: double
          example: 30.1
        lng:
          type: number
          format: double
          example: 31.3
        isActive:
          type: boolean
          example: true
        deliveryRadius:
          type: integer
          description: Delivery radius in kilometers
          example: 5

    BranchInput:
      type: object
      required:
        - label
        - countryCode
        - lat
        - lng
      properties:
        label:
          type: string
          example: Nasr City
        countryCode:
          type: string
          example: EG
        lat:
          type: number
          format: double
          example: 30.1
        lng:
          type: number
          format: double
          example: 31.3
        deliveryRadius:
          type: integer
          example: 5

    Product:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: Burger
        description:
          type: string
          example: Beef burger
        imageUrl:
          type: string
          example: https://example.com/burger.jpg
        price:
          type: number
          format: decimal
          example: 120
        currency:
          type: string
          example: EGP
        isAvailable:
          type: boolean
          example: true

    ProductInput:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          example: Burger
        description:
          type: string
          example: Beef burger
        imageUrl:
          type: string
          example: https://example.com/burger.jpg

    RestaurantMember:
      type: object
      properties:
        id:
          type: integer
        userId:
          type: integer
        restaurantId:
          type: integer
        status:
          type: string
          enum: [active, suspended, inactive]
        rolePermissionsId:
          type: integer
        createdAt:
          type: string
          format: date-time

    Role:
      type: object
      properties:
        id:
          type: integer
        role:
          type: string
          enum: [owner, manager, staff]
        permissionId:
          type: integer
        permissions:
          type: array
          items:
            type: object
            properties:
              resource:
                type: string
              action:
                type: string

    Pagination:
      type: object
      properties:
        page:
          type: integer
          example: 1
        limit:
          type: integer
          example: 10
        total:
          type: integer
          example: 1
        totalPages:
          type: integer
          example: 1

    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              example: validation_error
            message:
              type: string
              example: Invalid request parameters

  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    Unauthorized:
      description: Unauthorized - Missing or invalid token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    Forbidden:
      description: Forbidden - Insufficient permissions
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
